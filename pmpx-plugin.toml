# Read by pmpx when it scans the plugin directory; no dlopen is involved.
#
# `name` must equal `PackageManager::name()` -- the host refuses to load the library when they
# disagree, which is what catches a plugin directory assembled out of mismatched pieces.
[plugin]
name    = "npm"
version = "0.1.1"
abi     = 1
family  = "node"

# Evidence used to score this backend against a project root.
#
# The two lockfiles are strong (100): npm actually resolved this project. `package.json` is weak
# (10): it only proves the ecosystem, and pnpm, yarn and bun projects have one as well -- which
# is why this backend has to win on the lockfile and loses ties that the pins in `.pmpx.toml`
# exist to break.
[detect]
strong = ["package-lock.json", "npm-shrinkwrap.json"]
weak   = ["package.json"]
